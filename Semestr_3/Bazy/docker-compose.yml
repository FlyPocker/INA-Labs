services:
  db:
    image: mysql:8.0
    container_name: mysql_sakila
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=sakila
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mysql_data: